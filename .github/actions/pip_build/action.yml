name: Pip Build
description: >-
  Build and optionally test a repository's Python package with pip, using a
  native (apt/Homebrew) compiler toolchain on Linux or macOS. The calling
  job must provide python/pip on PATH (e.g. via actions/setup-python).

inputs:
  compiler:
    description: "One of: gcc-14, clang-18 (Linux); appleclang (macOS, i.e. /usr/bin/clang++, the compiler that builds the wheels). Installed via the native package manager (apt on Linux, Homebrew on macOS)."
    required: true
  run_cmake_tests:
    description: "Whether to build and run the CTest (C++) test suite (sets -DBUILD_TESTING)."
    required: false
    default: "true"
  run_python_tests:
    description: "Whether to install the package editable with its dev extras and run the pytest (Python) test suite."
    required: false
    default: "true"
  pip_opts:
    description: "Additional options to pass to pip install."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup NWX Dev Environment
      uses: NWChemEx/.github/.github/actions/setup_nwx_dev_env@master
      with:
        compiler: ${{ inputs.compiler }}

    - name: Cache Dependency Build Tree
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: deps-${{ runner.os }}-${{ inputs.compiler }}-${{ github.run_id }}
        restore-keys: |
          deps-${{ runner.os }}-${{ inputs.compiler }}-

    # The build runs without pip's build isolation, so its requirements are
    # installed into this environment first. With isolation, pip installs
    # them into a temporary pip-build-env-*/overlay that it deletes as soon
    # as the build finishes. Ecosystem dependencies are build requirements
    # (they resolve from their wheels), so the build-tree binaries the C++
    # tests run from would be linked against libraries in a directory that
    # no longer exists ("dyld: Library not loaded: @rpath/libutilities.dylib").
    # scikit-build-core recommends this setup for editable installs anyway.
    #
    # tomllib is in the standard library from Python 3.11 on.
    - name: Install Build Requirements
      shell: bash
      run: |
        python - <<'EOF' > build_requirements.txt
        import tomllib
        with open("pyproject.toml", "rb") as f:
            print("\n".join(tomllib.load(f)["build-system"]["requires"]))
        EOF
        cat build_requirements.txt
        pip install -r build_requirements.txt ${{ inputs.pip_opts }}
        rm build_requirements.txt

    # ENABLE_XHOST=OFF: several dependencies (gau2grid, libxc, GauXC's
    # vendored gau2grid) default it ON, which builds them with
    # "-march=native". The dependency tree cached above is shared across
    # the whole runner fleet, and it holds those dependencies' *built*
    # artifacts, so a restore onto a runner with a narrower instruction set
    # than the one that filled it hands the build a library it cannot
    # execute (SIGILL). Passed here rather than defaulted OFF in NWXCMake
    # so a local build on the machine it will run on still gets the tuning
    # (see set_default_nwx_options).
    - name: Install
      shell: bash
      run: |
        build_testing=${{ inputs.run_cmake_tests == 'true' && 'ON' || 'OFF' }}

        if [ "${{ inputs.run_python_tests }}" == "true" ]; then
            pip install -e ".[dev]" --no-build-isolation \
              --config-settings=cmake.define.CMAKE_C_COMPILER="${CC}" \
              --config-settings=cmake.define.CMAKE_CXX_COMPILER="${CXX}" \
              --config-settings=cmake.define.BUILD_TESTING="${build_testing}" \
              --config-settings=cmake.define.ENABLE_XHOST=OFF \
              ${{ inputs.pip_opts }}
        else
            pip install . --no-build-isolation \
              --config-settings=cmake.define.CMAKE_C_COMPILER="${CC}" \
              --config-settings=cmake.define.CMAKE_CXX_COMPILER="${CXX}" \
              --config-settings=cmake.define.BUILD_TESTING="${build_testing}" \
              --config-settings=cmake.define.ENABLE_XHOST=OFF \
              ${{ inputs.pip_opts }}
        fi

    - name: Test Python
      if: inputs.run_python_tests == 'true'
      shell: bash
      run: |
        set +e
        pytest -v
        pytest_exit=$?
        set -e

        if [ "$pytest_exit" -eq 5 ]; then
            echo "::error::run_python_tests is true but zero pytest tests were found."
            exit 1
        fi
        exit "$pytest_exit"

    - name: Test C++
      if: inputs.run_cmake_tests == 'true'
      shell: bash
      working-directory: build
      run: |
        total_tests=$(ctest -N | grep "Total Tests:" | grep -oE "[0-9]+$")
        if [ "${total_tests:-0}" -eq 0 ]; then
            echo "::error::run_cmake_tests is true but zero CTest tests were found."
            exit 1
        fi
        ctest -VV
