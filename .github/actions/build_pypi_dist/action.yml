name: Build PyPI Distribution
description: >-
  Checkout and build a repository's sdist and/or wheel into dist/, verifying
  the metadata and that the wheel installs cleanly. Does NOT publish --
  the calling job must add its own pypa/gh-action-pypi-publish step
  afterwards, as a sibling step never nested inside another composite
  action: gh-action-pypi-publish's own docker-trampoline image-tag
  resolution breaks when called from within a composite action (a known
  upstream limitation, actions/runner#2473). Runs on a bare runner
  (no `container:`).

inputs:
  cibw_build:
    description: >-
      A cibuildwheel CIBW_BUILD selector (e.g. cp312-manylinux_x86_64). When
      set, the wheel is built with pypa/cibuildwheel instead of `python -m
      build`, for a compiled package that needs a manylinux/macOS-portable
      wheel. Leave unset for a pure-Python package with no compiled extension
      (e.g. NWXCMake itself) -- a package with a CMakeLists.txt should always
      set this, since a wheel built directly (not via cibuildwheel) isn't
      manylinux-portable and PyPI will reject it.
      Intended to be called once per {os, cibw_build} matrix leg from the
      calling workflow; the job must NOT run inside a `container:`, since
      cibuildwheel manages its own (nested) build containers on Linux.
    required: false
    default: ""
  build_sdist:
    description: >-
      Whether this invocation ALSO builds the source distribution, in
      addition to the wheel. Does not affect the wheel itself -- that is
      always built whenever cibw_build is set, regardless of this input.
      Only relevant to multi-platform matrices: every leg would build
      byte-identical sdist content, and PyPI rejects re-uploading an
      existing filename, so set this to "true" on exactly one leg and
      "false" on the rest to publish the sdist once instead of once-per-leg.
      Ignored (always true) on the plain, non-cibw_build path, since
      there's only ever one leg there.
    required: false
    default: "true"
  extra_index_url:
    description: >-
      Extra package index passed to the post-build `pip install` sanity
      check (e.g. https://test.pypi.org/simple/), in addition to the
      default index. Needed when this package's runtime dependencies are
      other nwx packages that only exist on that extra index (e.g. a
      TestPyPI-only publish chain) -- without it, the verification install
      can only ever resolve dependencies that are already on the default
      index. Leave unset for a package with no such dependencies.
    required: false
    default: ""
  needs_mpi:
    description: >-
      Whether the cibuildwheel build needs an MPI installation. The
      manylinux/macOS cibuildwheel containers are minimal and don't have
      one, unlike the ambient dev matrix (see setup_nwx_dev_env). When
      "true", installs openmpi3-devel (via EPEL) inside the manylinux
      container and puts its bin/ on PATH so CMake's find_package(MPI)
      succeeds there, and installs open-mpi via Homebrew on macOS. Ignored
      when cibw_build is unset (the plain, non-cibuildwheel path assumes
      the ambient runner already has whatever the package needs).
    required: false
    default: "false"
  needs_boost:
    description: >-
      Whether the cibuildwheel build needs Boost. The manylinux/macOS
      cibuildwheel containers are minimal and don't have it. When "true",
      installs boost-devel (via EPEL) inside the manylinux container and
      boost via Homebrew on macOS. Ignored when cibw_build is unset.
    required: false
    default: "false"
  needs_blas:
    description: >-
      Whether the cibuildwheel build needs a BLAS/LAPACK installation (e.g.
      transitively via GauXC). The manylinux/macOS cibuildwheel containers
      are minimal and don't have one. When "true", installs openblas-devel
      and lapack-devel (via EPEL) inside the manylinux container, and
      openblas via Homebrew on macOS (pointing CMAKE_PREFIX_PATH at it,
      since it's keg-only there). Ignored when cibw_build is unset.
    required: false
    default: "false"
  needs_eigen:
    description: >-
      Whether the cibuildwheel build needs an installed Eigen3 CMake config
      (e.g. libint2's own CMakeLists does its own find_package(Eigen3),
      independent of and unsatisfied by nwxcmake's own FetchContent'd Eigen
      target). The manylinux/macOS cibuildwheel containers don't have one.
      When "true", installs eigen3-devel (via EPEL) inside the manylinux
      container and eigen via Homebrew on macOS. Ignored when cibw_build is
      unset.
    required: false
    default: "false"
  needs_openmp:
    description: >-
      Whether the cibuildwheel build needs OpenMP (e.g. transitively via
      GauXC, which unconditionally find_package(OpenMP)s). Linux's gcc
      ships its own OpenMP runtime (libgomp) so no extra provisioning is
      needed there; AppleClang has no built-in OpenMP support, so on macOS
      this installs libomp via Homebrew and points scikit-build-core's
      SKBUILD_CMAKE_ARGS at it (CMake's FindOpenMP can't locate Homebrew's
      keg-only libomp on its own). Ignored when cibw_build is unset.
    required: false
    default: "false"
  python_version:
    description: >-
      Python version to build the sdist/wheel with on the plain (non-
      cibuildwheel) path -- passed straight through to actions/setup-python.
      Ignored when cibw_build is set (that path pins the build interpreter
      itself via "Set up Python Matching cibuildwheel Target"). Defaults to
      "3.x" (whatever's newest) because that's harmless for a pure-Python
      package's wheel, which carries no Python-version tag. A compiled
      package that builds on the plain path (no cibw_build) needs this
      pinned to match "Set up Python Matching Ecosystem Release Target"'s
      hardcoded 3.12 below -- otherwise the wheel this step builds gets
      tagged with whatever "3.x" resolves to today, and the later verify
      step's pinned-3.12 interpreter can't install it ("is not a supported
      wheel on this platform").
    required: false
    default: "3.x"
  import_check:
    description: >-
      Space-separated module names to `import` in the post-build
      verification venv, after the wheel is installed there. Installing a
      wheel only unpacks it -- a compiled extension that crashes the
      interpreter the moment it's loaded (e.g. a pybind11 module linked
      against a different libpython than the headers it was compiled
      with) installs perfectly cleanly, so `pip install` alone can't tell
      a working wheel from an unloadable one. Importing it can, and a
      segfault there fails the job before the publish step ever runs.
      Runs on every leg, macOS included.

      Leave unset (the normal case) to import every top-level module the
      installed distribution actually declares in its own RECORD. That is
      read off the wheel rather than guessed from the distribution name,
      because the two don't reliably match across this ecosystem
      (nwchemex-weaklytypedfloat imports as `wtf`, and a package can
      install no importable module at all, in which case the check is
      correctly a no-op). Set this only to narrow or override that.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Packaging Tools
      shell: bash
      run: pip install --quiet build twine

    # Uses the normal (isolated) build-system.requires resolution, i.e. the
    # same git-fetched nwxcmake a real `pip install` from PyPI would use, so
    # this publishes exactly what a fresh `pip install` would build.
    - name: Build Source Distribution
      if: inputs.build_sdist == 'true'
      shell: bash
      run: python -m build --sdist --outdir dist

    # Building the wheel from the *extracted sdist* (rather than the repo
    # checkout) catches packaging bugs where a file the build needs was
    # never included in the sdist manifest -- publishing that wheel
    # unbuilt-from-sdist could otherwise ship silently broken. Only applies
    # to the plain path: cibuildwheel builds its own way (see below) and
    # doesn't need this repo's build-system.requires forwarded a second time.
    - name: Build Wheel From Source Distribution
      if: inputs.cibw_build == ''
      shell: bash
      run: |
        sdist=$(ls dist/*.tar.gz)
        rm -rf sdist_extracted
        mkdir sdist_extracted
        tar -xzf "${sdist}" -C sdist_extracted --strip-components=1

        python -m build --wheel --outdir dist sdist_extracted

    # Composes the CIBW_BEFORE_ALL_*/CIBW_ENVIRONMENT_* values in a shell
    # step (rather than inline ternary expressions in the cibuildwheel env:
    # block below) so needs_mpi and needs_boost can each independently
    # contribute a clause without one clobbering the other.
    - name: Compute cibuildwheel System Dependencies
      if: inputs.cibw_build != ''
      shell: bash
      run: |
        before_linux=()
        before_macos=()
        env_linux=()
        env_macos=("MACOSX_DEPLOYMENT_TARGET=11.0")

        # gcc-toolset-14, unconditionally. The pinned manylinux_2_28 image
        # ships gcc-toolset-13 (13.3.1), which has a constraint-satisfaction
        # bug: wtf::fp::FloatView<Float> becomes non-assignable from double as
        # soon as wtf/buffer/float_buffer.hpp is also included, even though
        # concepts::FloatingPoint<double> is satisfied and gcc gives no reason
        # at -fconcepts-diagnostics-depth=3. That breaks WeaklyTypedFloat and,
        # through it, TensorWrapper/Chemist/SimDE and everything downstream.
        # Verified locally: gcc 10.2.1 and gcc 14.2.1 both accept it, only 13
        # rejects it, and WeaklyTypedFloat builds a clean new-ABI wheel on 14.
        #
        # Installed into the pinned image rather than moving to a newer image
        # tag, so the base stays reproducible instead of chasing :latest.
        # Placed before the needs_* blocks so their own PATH/LD_LIBRARY_PATH
        # entries (e.g. needs_mpi's) prepend on top of it rather than replace
        # it.
        before_linux+=("dnf install -y gcc-toolset-14-gcc gcc-toolset-14-gcc-c++")
        env_linux+=(
          "PATH=/opt/rh/gcc-toolset-14/root/usr/bin:\$PATH"
          "LD_LIBRARY_PATH=/opt/rh/gcc-toolset-14/root/usr/lib64:/opt/rh/gcc-toolset-14/root/usr/lib:\$LD_LIBRARY_PATH"
          "PCP_DIR=/opt/rh/gcc-toolset-14/root"
        )

        if [ "${{ inputs.needs_mpi }}" = "true" ]; then
          # Built from source at the *exact* version Ubuntu 24.04's apt
          # package provides (see setup_nwx_dev_env), not EPEL's openmpi3
          # (3.1.3) as before -- OpenMPI's ABI is not guaranteed compatible
          # across major versions. (manylinux_2_28's AppStream does carry
          # an openmpi 4.1.1, but a source build pins the exact version
          # instead of whatever the distro floats to, so this stays as it
          # is; EPEL7, the package repo before the 2_28 switch, had no
          # openmpi4 at all and left no choice in the matter.) Still
          # needed even though the wheel no longer vendors MPI (see
          # CIBW_REPAIR_WHEEL_COMMAND_LINUX below): the extension must be
          # *compiled* against a matching OpenMPI to link correctly against
          # whatever system OpenMPI the wheel resolves to at runtime.
          #
          # --disable-dlopen got MPI_Init's MCA shmem component selection
          # working (previously failed: "opal_shmem_base_select failed",
          # since auditwheel only bundles a wheel's DT_NEEDED dependencies
          # found via ldd, not the dlopen()'d MCA plugin .so files normally
          # living under $prefix/lib/openmpi/), but a vendored wheel install
          # still crashes one step later: OpenMPI's singleton-mode ORTE
          # startup (ess_singleton_module.c) needs to locate the `orted`
          # daemon executable itself, and auditwheel/delocate only ever
          # bundle shared libraries, never the accompanying bin/ executables
          # -- "A system-required executable could not be found". Vendoring
          # MPI into the wheel is a dead end; see CIBW_REPAIR_WHEEL_COMMAND
          # below for the fix (exclude MPI libs, require system MPI instead).
          before_linux+=(
            "curl -fsSL https://download.open-mpi.org/release/open-mpi/v4.1/openmpi-4.1.6.tar.gz -o /tmp/openmpi.tar.gz"
            "mkdir -p /tmp/openmpi-src"
            "tar -xzf /tmp/openmpi.tar.gz -C /tmp/openmpi-src --strip-components=1"
            "cd /tmp/openmpi-src && ./configure --prefix=/usr/local/openmpi --disable-mpi-fortran --disable-dlopen"
            "cd /tmp/openmpi-src && make -j\$(nproc) install"
          )
          env_linux+=("PATH=/usr/local/openmpi/bin:\$PATH" "LD_LIBRARY_PATH=/usr/local/openmpi/lib:\$LD_LIBRARY_PATH")
          # auditwheel repair normally bundles every DT_NEEDED lib (incl.
          # libmpi/libopen-rte/libopen-pal) into the wheel via
          # RPATH-relocation. Excluding them here means the wheel links
          # against whatever libmpi.so.40 is on the *runtime* system's
          # linker path instead -- the one that ships with a real OpenMPI
          # install (incl. its bin/orted), which setup_nwx_dev_env already
          # provides ambient (libopenmpi-dev/openmpi-bin) and which end users
          # need to install themselves (documented as a runtime requirement).
          #
          # Exact sonames (libmpi.so.40), NOT a glob (libmpi*). The old
          # manylinux2014 image (quay.io/pypa/manylinux2014_x86_64:
          # 2024.11.16-1) baked in auditwheel 6.1.0, whose --exclude did a
          # plain `soname in exclude` set-membership check (confirmed by
          # reading that exact container's lddtree.py); fnmatch/glob support
          # for --exclude only arrived in a later release, so a glob
          # silently matched nothing and bundled the library anyway
          # (reproduced via Docker against 6.1.0: 'libmpi*' bundled
          # libmpi/libopen-rte/libopen-pal same as no --exclude at all,
          # while 'libmpi.so.40' correctly excluded it). manylinux_2_28
          # ships auditwheel 6.7.0, which does support globs, but the exact
          # sonames are kept: they work under both, and they name precisely
          # what is meant. Since libopen-rte/libopen-pal are only reachable
          # *through* libmpi in this tree, excluding libmpi.so.40 alone is
          # sufficient -- auditwheel doesn't recurse into an excluded
          # library's own dependencies.
          {
            echo "CIBW_REPAIR_WHEEL_COMMAND_LINUX=auditwheel repair --exclude 'libmpi.so.40' --exclude 'libopen-rte.so.40' --exclude 'libopen-pal.so.40' -w {dest_dir} {wheel}"
          } >> "$GITHUB_ENV"
          before_macos+=("brew install open-mpi")
          # macOS needs the same MPI exclusion as Linux above, for a second,
          # macOS-specific reason on top of the bin/orted one.
          #
          # delocate's default behaviour copies libmpi.40.dylib (plus
          # libopen-pal, libpmix, libevent*, libhwloc) into
          # <pkg>.dylibs/ and rewrites libparallelzone.dylib to load them
          # via @loader_path. A wheel repaired that way ALSO ships the C++
          # SDK (headers + lib/cmake/<pkg> + lib/lib<pkg>.dylib), so a
          # downstream CMake build -- e.g. SCF's test_cmake_build leg --
          # links its own executable against the *system* (Homebrew)
          # libmpi.40.dylib while the wheel's dylib still loads the vendored
          # copy. Both OpenMPI images are then live in one process with
          # independent copies of `ompi_mpi_comm_world`, and they do not stay
          # in sync: MPI_Init (reached through the vendored libmpi) returns
          # MPI_SUCCESS having populated the *Homebrew* copy, while the
          # wheel dylib's own reference still resolves to the vendored copy,
          # which is left zero-filled. The first MPI_Comm_size on it then
          # dereferences a NULL c_local_group:
          #
          #   Signal: Segmentation fault: 11 / Signal code: Invalid permissions
          #   Failing at address: 0x10
          #    [1] libparallelzone.dylib CommPPPIMPL::CommPPPIMPL(ompi_communicator_t*)
          #
          # Excluding the MPI stack makes the wheel's dylib keep an absolute
          # /opt/homebrew/opt/open-mpi/... install name, so there is exactly
          # one OpenMPI in the process. Substring matching (delocate matches
          # --exclude against the library name), unlike auditwheel's exact
          # sonames above.
          {
            echo "CIBW_REPAIR_WHEEL_COMMAND_MACOS=delocate-wheel --require-archs {delocate_archs} --exclude libmpi --exclude libopen-pal --exclude libopen-rte --exclude libpmix --exclude libevent --exclude libhwloc -w {dest_dir} -v {wheel}"
          } >> "$GITHUB_ENV"
          # Homebrew's open-mpi (and its own deps: libpmix, libhwloc,
          # libevent) are built against the actual runner OS, so their
          # dylibs report a minimum target matching it (14.0 on macos-14) --
          # higher than cibuildwheel's default arm64 target (11.0). Even with
          # those dylibs now excluded from the wheel, the *extension itself*
          # is compiled against them and inherits that minimum, so delocate
          # still refuses to tag the wheel 11.0. Raise the declared target to
          # match what is actually linked.
          env_macos=("MACOSX_DEPLOYMENT_TARGET=14.0")
        fi

        if [ "${{ inputs.needs_boost }}" = "true" ]; then
          # The image's base boost-devel is too old for headers some repos
          # need: boost/container_hash/hash.hpp arrived in Boost 1.67, and
          # the base package is 1.53.0 on manylinux2014 and 1.66.0 on
          # manylinux_2_28 -- verified absent in both. EPEL's boost169-devel
          # (1.69.0, parallel-installable, doesn't replace the base
          # boost-devel) carries it, and installs at the same
          # /usr/include/boost169 path under EPEL7 and EPEL8 alike. That
          # versioned, non-default include path is why CMake's FindBoost has
          # to be pointed at it explicitly via BOOST_INCLUDEDIR.
          #
          # epel-release is installed here rather than assumed: EPEL came
          # pre-enabled on manylinux2014, but NOT on the manylinux_2_28
          # image cibuildwheel v2.22.0 pins (2024.11.16-1) -- verified, it
          # ships only baseos/appstream/extras/powertools, and this
          # yum install fails without it. Harmlessly repeated by the
          # needs_blas and needs_eigen branches below.
          before_linux+=("yum install -y epel-release" "yum install -y boost169-devel")
          env_linux+=("BOOST_INCLUDEDIR=/usr/include/boost169")
          before_macos+=("brew install boost")
        fi

        if [ "${{ inputs.needs_blas }}" = "true" ]; then
          before_linux+=("yum install -y epel-release" "yum install -y openblas-devel lapack-devel")
          before_macos+=("brew install openblas")
          # Quoted: cibuildwheel's CIBW_ENVIRONMENT parses space-separated
          # KEY=VALUE tokens, and the $(brew --prefix ...) substitution's
          # arguments contain a space, which would otherwise split it into
          # two bogus tokens.
          env_macos+=('CMAKE_PREFIX_PATH="$(brew --prefix openblas)"')
        fi

        if [ "${{ inputs.needs_eigen }}" = "true" ]; then
          before_linux+=("yum install -y epel-release" "yum install -y eigen3-devel")
          before_macos+=("brew install eigen")
        fi

        if [ "${{ inputs.needs_openmp }}" = "true" ]; then
          before_macos+=("brew install libomp")
          # AppleClang has no built-in OpenMP; CMake's FindOpenMP can't
          # locate Homebrew's keg-only libomp without explicit hints. Quoted
          # as a single token for the same reason as CMAKE_PREFIX_PATH above.
          env_macos+=('SKBUILD_CMAKE_ARGS="-DOpenMP_C_FLAGS=-Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include;-DOpenMP_C_LIB_NAMES=omp;-DOpenMP_CXX_FLAGS=-Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include;-DOpenMP_CXX_LIB_NAMES=omp;-DOpenMP_omp_LIBRARY=$(brew --prefix libomp)/lib/libomp.dylib"')
        fi

        # Appended after every needs_* branch, not seeded with the arrays
        # above, because the needs_mpi branch *reassigns* env_macos rather
        # than appending to it (to raise MACOSX_DEPLOYMENT_TARGET) and would
        # drop anything set earlier.
        #
        # Unconditional, and deliberately not tied to any needs_* input: a
        # published wheel must never be tuned to whichever runner built it.
        # gau2grid, libxc and GauXC's vendored gau2grid all default
        # ENABLE_XHOST ON, which compiles them "-march=native" -- so a wheel
        # built on an AVX-512 runner raises SIGILL on a user's machine
        # without it. NWXCMake keeps ON as the default for local builds
        # (see set_default_nwx_options) and expects redistributable builds
        # to say otherwise, which is what this does.
        #
        # SKBUILD_CMAKE_DEFINE (scikit-build-core's env spelling of
        # cmake.define.*, ";"-separated KEY=VALUE) rather than
        # SKBUILD_CMAKE_ARGS, which needs_openmp already claims on macOS --
        # a second assignment to it there would clobber the OpenMP hints.
        #
        # The inner quotes around ENABLE_XHOST=OFF are load-bearing, for the
        # same class of reason as CMAKE_PREFIX_PATH above. cibuildwheel does
        # not hand CIBW_ENVIRONMENT to a shell: it splits it into KEY=VALUE
        # assignments itself and evaluates each VALUE with bashlex, its
        # vendored mini-bash. An unquoted value of ENABLE_XHOST=OFF is itself
        # a syntactically valid bash assignment, and bashlex_eval.evaluate_node
        # has no handler for that node kind, so the whole build dies before
        # before_all even runs, with
        #
        #   ValueError: Unsupported bash construct: 'assignment'
        #
        # Quoting makes it a plain word; the quotes are stripped during
        # evaluation, so CMake still sees ENABLE_XHOST=OFF. This bites any
        # value containing "=", on every platform -- not just macOS.
        env_linux+=('SKBUILD_CMAKE_DEFINE="ENABLE_XHOST=OFF"')
        env_macos+=('SKBUILD_CMAKE_DEFINE="ENABLE_XHOST=OFF"')

        join_and() {
          local out="" item
          for item in "$@"; do
            if [ -z "$out" ]; then out="$item"; else out="$out && $item"; fi
          done
          echo "$out"
        }

        {
          echo "CIBW_BEFORE_ALL_LINUX=$(join_and "${before_linux[@]}")"
          echo "CIBW_BEFORE_ALL_MACOS=$(join_and "${before_macos[@]}")"
          echo "CIBW_ENVIRONMENT_LINUX=${env_linux[*]}"
          echo "CIBW_ENVIRONMENT_MACOS=${env_macos[*]}"
        } >> "$GITHUB_ENV"

    # cibuildwheel manages its own (manylinux/macOS) build images, so it
    # builds straight from the repo checkout rather than an extracted sdist.
    - name: Build Wheel With cibuildwheel
      if: inputs.cibw_build != ''
      uses: pypa/cibuildwheel@v2.22.0
      env:
        CIBW_BUILD: ${{ inputs.cibw_build }}
        CIBW_BUILD_VERBOSITY: "1"
        # Overrides cibuildwheel v2.22.0's default manylinux2014 image.
        # That image is CentOS 7 + devtoolset-10, whose libstdc++ is built
        # with _GLIBCXX_USE_DUAL_ABI 0 -- its <bits/c++config.h> does an
        # unconditional "#undef _GLIBCXX_USE_CXX11_ABI" and pins the macro
        # to 0, so it *discards* any -D_GLIBCXX_USE_CXX11_ABI=1 passed in.
        # The new ABI is not merely off there, it is compiled out of the
        # toolchain. Every C++ library in a Linux wheel therefore exported
        # the pre-C++11 COW std::string ABI (pluginplay::ModuleManager::at
        # taking RKSs rather than RKNSt7__cxx11...), which nothing built on
        # a modern distro can link against: the dev matrix
        # (ubuntu-24.04, gcc-14/clang-18) defaults to the new ABI, so
        # SCF's test_cmake_build died at link with hundreds of undefined
        # references to ecosystem symbols once it finally got far enough to
        # link at all.
        #
        # manylinux_2_28 (AlmaLinux 8) defaults to _GLIBCXX_USE_CXX11_ABI 1,
        # and its auditwheel policy permits the GLIBCXX_3.4.21 symbols the new
        # ABI needs -- manylinux_2_17 caps at 3.4.19, which is the other half
        # of why the flag route is a dead end rather than merely risky.
        #
        # NB the PINNED tag ships gcc-toolset-13 (13.3.1), NOT 14.2.1; only
        # :latest has 14. gcc-toolset-14 is installed explicitly above, which
        # is what actually lines the wheel build up with the dev matrix's
        # gcc-14.
        #
        # Verified against the exact image cibuildwheel v2.22.0 pins
        # (quay.io/pypa/manylinux_2_28_x86_64:2024.11.16-1, NOT :latest,
        # which differs): yum is present, PowerTools is enabled out of the
        # box so openblas-devel/lapack-devel/eigen3-devel resolve, and
        # boost169-devel resolves at the same /usr/include/boost169 path
        # once epel-release is installed -- EPEL is pre-enabled on
        # manylinux2014 but not here, which is why the needs_boost branch
        # above now installs it explicitly.
        #
        # Raises the minimum glibc for a consumer of these wheels from 2.17
        # (CentOS 7, long EOL) to 2.28 (RHEL 8 / Ubuntu 18.10 and newer).
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

    - name: Collect cibuildwheel Output
      if: inputs.cibw_build != ''
      shell: bash
      run: |
        mkdir -p dist
        mv wheelhouse/*.whl dist/

    - name: Check Packaging Metadata
      shell: bash
      run: twine check dist/*

    # A cibuildwheel wheel is tagged for one specific CPython (e.g. cp312),
    # which usually differs from the ambient "Set up Python" 3.x (latest).
    # Installing it there would fail with "not a supported wheel on this
    # platform", so re-point PATH at a matching interpreter first.
    - name: Determine cibuildwheel Python Version
      if: inputs.cibw_build != ''
      id: cibw_python_version
      shell: bash
      run: |
        # e.g. "cp312-manylinux_x86_64" -> "3.12"
        if [[ "${{ inputs.cibw_build }}" =~ ^cp([0-9])([0-9]+) ]]; then
          echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
        else
          echo "::error::Could not parse a Python version out of cibw_build='${{ inputs.cibw_build }}'"
          exit 1
        fi

    - name: Set up Python Matching cibuildwheel Target
      if: inputs.cibw_build != ''
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.cibw_python_version.outputs.version }}

    # The plain (non-cibw) path's wheel itself is version-agnostic
    # (py3-none-any), but a pure-Python package's runtime dependencies can
    # include other nwx-ecosystem packages that are compiled and only
    # published for one CPython version (cp312, per platform_matrix.yaml's
    # release_matrix) -- installing under whatever "Set up Python"'s "3.x"
    # resolves to today (e.g. 3.14) would find no matching wheel for those
    # and fall back to building them from source, which fails on this bare
    # verification venv (no MPI/Boost/etc.). Re-point at 3.12 to match.
    - name: Set up Python Matching Ecosystem Release Target
      if: inputs.cibw_build == ''
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # Cheap safety net before publishing to a registry where a bad upload
    # can only be yanked, never truly deleted: catch an unimportable wheel
    # here rather than after it's live on PyPI.
    # The Linux wheel deliberately does NOT vendor MPI: CIBW_REPAIR_WHEEL_COMMAND_LINUX
    # excludes libmpi/libopen-rte/libopen-pal so the wheel links against whatever
    # OpenMPI is on the runtime system, because vendoring it is a dead end
    # (auditwheel bundles shared libraries but never the accompanying bin/orted
    # that OpenMPI's singleton startup needs). The flip side of that contract is
    # that *something* has to provide MPI wherever such a wheel is imported.
    #
    # Nothing does, here. CIBW_BEFORE_ALL_LINUX builds OpenMPI into
    # /usr/local/openmpi inside the manylinux *container*; the verification below
    # runs on the runner host, which has no MPI at all. So importing the freshly
    # built wheel fails with
    #
    #   ImportError: libmpi.so.40: cannot open shared object file
    #
    # Installing it here makes the host look like the end user's machine the
    # wheel documents as a requirement. Same packages setup_nwx_dev_env uses, so
    # the ABI matches what CIBW_BEFORE_ALL_LINUX compiled against (Ubuntu 24.04
    # ships the OpenMPI 4.1.x that provides libmpi.so.40).
    #
    # macOS needs none of this even though its wheel no longer vendors MPI
    # either (CIBW_REPAIR_WHEEL_COMMAND_MACOS above): cibuildwheel builds macOS
    # wheels natively on the runner host rather than in a container, so the
    # `brew install open-mpi` from CIBW_BEFORE_ALL_MACOS has already installed
    # MPI on the very machine that runs the verification below.
    - name: Install Runtime MPI for Verification
      if: inputs.cibw_build != '' && inputs.needs_mpi == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev openmpi-bin

    - name: Verify Wheel Installs
      shell: bash
      run: |
        python -m venv /tmp/build_pypi_dist_venv
        . /tmp/build_pypi_dist_venv/bin/activate
        wheel=$(ls dist/*.whl)
        extra_index_args=()
        if [ -n "${{ inputs.extra_index_url }}" ]; then
          extra_index_args=(--extra-index-url "${{ inputs.extra_index_url }}")
        fi
        pip install --quiet "${extra_index_args[@]}" "${wheel}"

        # See the import_check input: pip install proves the wheel unpacks,
        # not that its extension modules can actually be loaded. Deliberately
        # in this same step rather than a new one, so it inherits the
        # interpreter the preceding setup-python step re-pointed PATH at
        # (the cibuildwheel target version, not the ambient "3.x").
        dist_name=$(basename "${wheel}" | cut -d- -f1)
        IMPORT_CHECK="${{ inputs.import_check }}" DIST_NAME="${dist_name}" \
          python "${GITHUB_ACTION_PATH}/import_check.py"
