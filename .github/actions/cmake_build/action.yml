name: CMake Build
description: >-
  Configure, build, and optionally test a repository with CMake using a
  native (apt/Homebrew) compiler toolchain on Linux or macOS. The calling
  job must provide python/pip on PATH (e.g. via actions/setup-python) for
  the Python test step.

inputs:
  compiler:
    description: "One of: gcc-14, clang-18 (Linux); appleclang (macOS, i.e. /usr/bin/clang++, the compiler that builds the wheels). Installed via the native package manager (apt on Linux, Homebrew on macOS)."
    required: true
  run_cmake_tests:
    description: "Whether to build and run the CTest (C++) test suite (sets -DBUILD_TESTING)."
    required: false
    default: "true"
  run_python_tests:
    description: "Whether to run the pytest (Python) test suite against the built pybind11 module."
    required: false
    default: "true"
  cmake_opts:
    description: "Additional CMake options to pass at configure time."
    required: false
    default: ""
  extra_pip_packages:
    description: "Extra packages to pip install into the ambient Python before the C++ test step (e.g. CTest-driven Python tests that import a pip-installed package)."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup NWX Dev Environment
      uses: NWChemEx/.github/.github/actions/setup_nwx_dev_env@master
      with:
        compiler: ${{ inputs.compiler }}

    # Some repos' CMake build invokes a Python codegen script at configure or
    # build time (e.g. GauXC's gau2grid dependency imports numpy to generate
    # C source), so this needs to run before Configure/Build below, not only
    # before the Python test step later in this same file.
    - name: Install Python Requirements
      shell: bash
      run: |
        if [ -f requirements.txt ]; then
          pip install --quiet -r requirements.txt
        fi

    # Runs before Configure, not just before "Test C++"/"Test Python": a
    # repo doing integration testing (e.g. -DINTEGRATION_TESTING=ON) needs
    # the published ecosystem (nwchemex and its dependencies) already on
    # site-packages by configure time, so that NWXCMake's
    # nwx_ecosystem_dependency() resolves each sibling from its installed
    # wheel instead of git master -- matching the sequence a real developer
    # follows ("pip install nwchemex", then build their local checkout) and
    # actually exercising NWXCMake's self-override rule (the repo under test
    # always wins over its own published copy) rather than that rule merely
    # being true by accident of nothing being installed yet at configure
    # time. See https://nwchemex.github.io/author/testing/integration/.
    - name: Install Extra Pip Packages
      if: inputs.extra_pip_packages != ''
      shell: bash
      run: pip install --quiet ${{ inputs.extra_pip_packages }}

    - name: Cache Dependency Build Tree
      uses: actions/cache@v4
      with:
        path: build/_deps
        key: deps-${{ runner.os }}-${{ inputs.compiler }}-${{ github.run_id }}
        restore-keys: |
          deps-${{ runner.os }}-${{ inputs.compiler }}-

    # Caches compiled-object output (keyed internally by ccache off
    # preprocessed source + flags), unlike "Cache Dependency Build Tree"
    # above which only caches FetchContent's source checkouts. This is what
    # actually avoids recompiling the ~9 FetchContent'd C++ dependencies
    # (and their pybind11 bindings) on every run when nothing changed.
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ inputs.compiler }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ inputs.compiler }}-

    # ENABLE_XHOST=OFF: several dependencies (gau2grid, libxc, GauXC's
    # vendored gau2grid) default it ON, which builds them with
    # "-march=native". The two caches above are shared across the whole
    # runner fleet, and ccache hashes the flag *text* rather than the ISA
    # "native" resolves to, so a hit restored from a job that ran on an
    # AVX-512 host serves those instructions to a job that ran on one
    # without -- which is exactly how NWChemEx/SCF's ubuntu leg started
    # failing intermittently with SIGILL inside gau2grid. Passed here
    # rather than defaulted OFF in NWXCMake so a local build on the machine
    # it will run on still gets the tuning (see set_default_nwx_options).
    - name: Configure
      shell: bash
      run: |
        build_testing=${{ inputs.run_cmake_tests == 'true' && 'ON' || 'OFF' }}

        # Pin CMake's FindPython to the interpreter actions/setup-python put on
        # PATH (and that "Install Python Requirements" above just installed
        # into). Without this, CMake's own search can prefer a different
        # ambient interpreter (e.g. a macOS Homebrew framework Python),
        # leaving configure-time-installed packages invisible to build-time
        # codegen scripts that embed a Python interpreter.
        #
        # Python_EXECUTABLE alone only pins the interpreter/header search --
        # on macOS, FindPython's separate Development.Module/.Embed library
        # lookups can still independently resolve to a *different* Homebrew
        # framework Python (e.g. python@3.14, present on GitHub's macos-14
        # runner image regardless of what this job's own `brew install`
        # pulls in) even though the headers matched the pinned 3.12
        # interpreter. This produced a pybind11 module compiled against 3.12
        # headers but linked against 3.14's libpython -- confirmed via
        # `otool -L` showing a hardcoded link to
        # /opt/homebrew/opt/python@3.14/.../Python -- which crashed at
        # import time inside pybind11's own version-mismatch error path (see
        # scf-macos-pybind11-segfault.md in NWChemEx/SCF for the full
        # investigation). Python_FIND_STRATEGY=LOCATION is CMake's own
        # documented mechanism for tying *all* Development component lookups
        # to wherever the interpreter itself was found, instead of a
        # separate framework search; explicitly forcing Python_LIBRARY
        # instead was also tried and rejected -- it fixed the pybind11
        # module link but broke a different dependency's
        # Development.Embed lookup. Both Python_ and Python3_ spellings are
        # set since different dependencies in the FetchContent graph call
        # find_package() with either casing.
        python_pin_opts=(-DPython_EXECUTABLE="$(command -v python3)")
        if [ "$RUNNER_OS" = "macOS" ]; then
            python_pin_opts+=(
                -DPython_FIND_STRATEGY=LOCATION
                -DPython3_FIND_STRATEGY=LOCATION
            )
        fi

        cmake -Bbuild -H. -GNinja \
          -DCMAKE_INSTALL_PREFIX=./install \
          -DCMAKE_C_COMPILER="${CC}" \
          -DCMAKE_CXX_COMPILER="${CXX}" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DBUILD_TESTING="${build_testing}" \
          -DENABLE_XHOST=OFF \
          "${python_pin_opts[@]}" \
          ${{ inputs.cmake_opts }}

    - name: Build
      shell: bash
      # Unbounded `--parallel` (defaults to nproc) starts one gcc/clang
      # invocation per core simultaneously; heavily-templated C++ (e.g.
      # sigma's TaylorModel headers) makes each of those invocations
      # memory-heavy enough that nproc concurrent compiles can exceed a
      # GitHub-hosted runner's RAM. That OOM-kills the compiler *and* the
      # runner's own listener process, which GitHub Actions then reports as
      # the job being cancelled (exit 143 / "runner has received a shutdown
      # signal") instead of a normal build failure -- confirmed via 3
      # consecutive reproductions of exactly this on test_enable_sigma's
      # (ubuntu-latest, gcc-14) matrix cell, while every other cell
      # (including the same sigma build on macos-14 and on
      # ubuntu-latest/clang-18) passed. Halving nproc trades some build
      # speed for headroom; revisit if it turns out insufficient.
      run: |
        nproc_count=$(getconf _NPROCESSORS_ONLN)
        jobs=$(( nproc_count / 2 ))
        if [ "$jobs" -lt 1 ]; then
            jobs=1
        fi
        cmake --build build --parallel "$jobs"

    - name: ccache Stats
      shell: bash
      run: ccache -s

    - name: Test C++
      if: inputs.run_cmake_tests == 'true'
      shell: bash
      working-directory: build
      # Some C++ tests embed a Python interpreter that imports this repo's
      # own (and its dependencies') built pybind11 modules -- same PYTHONPATH
      # need as the pytest step below, just computed relative to build/.
      run: |
        total_tests=$(ctest -N | grep "Total Tests:" | grep -oE "[0-9]+$")
        if [ "${total_tests:-0}" -eq 0 ]; then
            echo "::error::run_cmake_tests is true but zero CTest tests were found."
            exit 1
        fi
        pythonpath=$(find . -name "*.so" -exec dirname {} \; | sort -u | paste -sd: -)
        PYTHONPATH="$pythonpath" ctest -VV

    - name: Test Python
      if: inputs.run_python_tests == 'true'
      shell: bash
      run: |
        pip install --quiet pytest

        pythonpath=$(find build -name "*.so" -exec dirname {} \; | sort -u | paste -sd: -)
        if [ -z "$pythonpath" ]; then
            echo "::error::run_python_tests is true but no built Python module (*.so) was found under build/."
            exit 1
        fi

        set +e
        PYTHONPATH="$pythonpath" pytest -v
        pytest_exit=$?
        set -e

        if [ "$pytest_exit" -eq 5 ]; then
            echo "::error::run_python_tests is true but zero pytest tests were found."
            exit 1
        fi
        exit "$pytest_exit"
