name: Deploy Documentation

on:
  workflow_call:
    inputs:
      doc_target:
        description: "The name of the documentation target. Set to 'Sphinx' to skip doxygen"
        type: string
        required: true
      generate_module_docs:
        description: "Whether or not to generate PluginPlay Module documentation"
        type: boolean
        default: false
      wheel_artifact_name:
        description: "Name of the uploaded wheel artifact to install for module-doc generation (required when generate_module_docs is true)"
        type: string
        default: ""

jobs:
  deploy_docs:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nwchemex/nwx_buildenv:latest
    steps:
      - name: Fail if Target is Blank
        if: inputs.doc_target == ''
        uses: actions/github-script@v3
        with:
          script: |
            core.setFailed("doc_target must not be blank.")
      - name: Fail if Wheel Artifact Name is Blank
        if: inputs.generate_module_docs == true && inputs.wheel_artifact_name == ''
        uses: actions/github-script@v3
        with:
          script: |
            core.setFailed("wheel_artifact_name must be set when generate_module_docs is true.")
      - name: Checkout Source
        uses: actions/checkout@v4
      # Configure CMake for a docs-only build (no library targets get
      # configured/built -- see NWXCMake's ONLY_BUILD_DOCS option).
      - name: Configure Docs
        if: inputs.doc_target != 'Sphinx'
        run: |
          cmake -Bbuild -H. -GNinja -DBUILD_DOCS=ON -DONLY_BUILD_DOCS=ON
        shell: bash
      # Build the Doxygen docs
      - name: Build Doxygen Docs
        if: ${{ inputs.doc_target != 'Sphinx' }}
        run: |
          cmake --build build --target ${{ inputs.doc_target }} --parallel

          # Migrate the Doxygen documentation to the docs source
          mkdir docs/build
          mkdir docs/build/html
          mv build/html "docs/build/html/${{ inputs.doc_target }}"
        shell: bash
      # Module-doc generation needs an importable, compiled copy of the
      # target module -- rather than building the library from source here,
      # install the wheel that a sibling job in the caller workflow already
      # built (e.g. build_pypi_dist).
      - name: Download Wheel Artifact
        if: inputs.generate_module_docs == true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.wheel_artifact_name }}
          path: dist
      - name: Install Wheel
        if: inputs.generate_module_docs == true
        run: |
          . /pyenv/bin/activate
          pip install dist/*.whl
        shell: bash
      # Generate the module docs source files
      - name: Generate Module Docs
        if: inputs.generate_module_docs == true
        run: |
          . /pyenv/bin/activate
          python3 /scripts/generate_module_dox.py ${{ inputs.doc_target }}
      # Build the Sphinx docs and then deploy
      - name: Sphinx Docs
        run: |
          . /pyenv/bin/activate
          cd docs
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          make html
        shell: bash
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          publish_dir: ./docs/build/html
