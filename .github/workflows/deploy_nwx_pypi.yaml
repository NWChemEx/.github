name: Deploy NWX PyPI
# Build and publish a package to PyPI, or just verify it builds with
# dry_run: true. For a compiled (CMake/pybind11) package, wheels are built
# per-platform across the shared NWChemEx release matrix (see
# platform_matrix.yaml) via cibuildwheel. For a pure-Python package, a
# single sdist/wheel is built and published once.

on:
  workflow_call:
    inputs:
      compiled:
        description: "Whether this package has a compiled (CMake/pybind11) extension needing per-platform wheels via cibuildwheel. Set to false for a pure-Python package."
        type: boolean
        required: false
        default: true
      dry_run:
        description: "When 'true', build and verify everything but skip the actual PyPI upload."
        type: string
        required: false
        default: "false"
      use_test_pypi:
        description: "When 'true', publish to Test PyPI instead of the real PyPI."
        type: string
        required: false
        default: "false"

jobs:
  platform_matrix:
    if: inputs.compiled
    uses: ryanmrichard/.github/.github/workflows/platform_matrix.yaml@master

  deploy_to_pypi:
    if: inputs.compiled
    needs: platform_matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platform_matrix.outputs.release_matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Deploy to PyPI
        uses: ryanmrichard/.github/.github/actions/deploy_to_pypi@master
        with:
          cibw_build: ${{ matrix.cibw_build }}
          build_sdist: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
          dry_run: ${{ inputs.dry_run }}
          use_test_pypi: ${{ inputs.use_test_pypi }}

  deploy_to_pypi_pure_python:
    if: ${{ !inputs.compiled }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Deploy to PyPI
        uses: ryanmrichard/.github/.github/actions/deploy_to_pypi@master
        with:
          dry_run: ${{ inputs.dry_run }}
          use_test_pypi: ${{ inputs.use_test_pypi }}
