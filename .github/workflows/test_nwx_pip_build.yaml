name: Test NWX Pip Build
# Build and test a repository's Python package with pip, across the shared
# NWChemEx dev matrix (see platform_matrix.yaml).

on:
  workflow_call:
    inputs:
      run_cmake_tests:
        description: "Whether to build and run the CTest (C++) test suite (sets -DBUILD_TESTING)."
        type: string
        required: false
        default: "true"
      run_python_tests:
        description: "Whether to install the package editable with its dev extras and run the pytest (Python) test suite."
        type: string
        required: false
        default: "true"
      pip_opts:
        description: "Additional options to pass to pip install."
        type: string
        required: false
        default: ""
      allow_macos_failure:
        description: >-
          If "true", a failure on the macos-14 matrix leg is reported but
          does not fail the job/block the workflow (via continue-on-error).
          Other legs are unaffected. For repos with a known, tracked,
          macOS-only issue that shouldn't block merges while it's being
          investigated -- default "false" keeps the normal all-legs-required
          behavior for every other caller.
        type: string
        required: false
        default: "false"

jobs:
  platform_matrix:
    uses: NWChemEx/.github/.github/workflows/platform_matrix.yaml@master

  test_pip_build:
    needs: platform_matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platform_matrix.outputs.dev_matrix) }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-14' && inputs.allow_macos_failure == 'true' }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Pip Build
        uses: NWChemEx/.github/.github/actions/pip_build@master
        with:
          compiler: ${{ matrix.compiler }}
          run_cmake_tests: ${{ inputs.run_cmake_tests }}
          run_python_tests: ${{ inputs.run_python_tests }}
          pip_opts: ${{ inputs.pip_opts }}
