name: Deploy to PyPI
# Builds sdist/wheels across the release matrix (see platform_matrix.yaml)
# and publishes them in a single step. Publishing is split into its own
# ubuntu-latest job (rather than a publish step per matrix leg) because
# pypa/gh-action-pypi-publish only runs on Linux; a macOS leg's own publish
# step fails outright ("This action is only able to run under GNU/Linux
# environments"). Each leg's dist/ is instead uploaded as an artifact and
# merged before the one Linux-only publish step runs.

on:
  workflow_call:
    inputs:
      repository_url:
        description: "PyPI index to publish to."
        type: string
        required: false
        default: "https://test.pypi.org/legacy/"
      extra_index_url:
        description: >-
          Extra package index for build_pypi_dist's post-build install
          sanity check (see that action's extra_index_url input).
        type: string
        required: false
        default: ""

jobs:
  platform_matrix:
    uses: ryanmrichard/.github/.github/workflows/platform_matrix.yaml@master

  build:
    needs: platform_matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platform_matrix.outputs.release_matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Build PyPI Distribution
        uses: ryanmrichard/.github/.github/actions/build_pypi_dist@master
        with:
          cibw_build: ${{ matrix.cibw_build }}
          build_sdist: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
          extra_index_url: ${{ inputs.extra_index_url }}

      - name: Upload Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download All Distributions
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: ${{ inputs.repository_url }}
